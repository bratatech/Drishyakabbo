# Netlify Configuration File
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory where the build command will be executed (relative to repo root)
  base = "frontend"

  # Build command to generate the production site
  command = "npm run build"

  # Directory to publish, relative to the base directory (Vite's default output)
  publish = "dist"

# Support client-side routing (React Router) in Single Page Applications (SPAs).
# Redirects all paths to index.html and lets React Router handle the routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for the entire site
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "upgrade-insecure-requests"

# Caching optimization for hashed static assets generated by Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
